<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">EasyCalendar GitHub header</title>
  <desc id="desc">EasyCalendar local-first calendar and Due manager, expressed through a calm river-teal calendar, ivory glass panels, and sparse flower-color accents.</desc>


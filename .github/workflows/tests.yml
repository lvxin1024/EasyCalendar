name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: flutter analyze
        working-directory: client
      - run: flutter test
        working-directory: client

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Configure ephemeral CI signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/easycalendar-ci.jks" \
            -storepass easycalendar-ci -keypass easycalendar-ci \
            -alias easycalendar-ci -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=EasyCalendar CI"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/easycalendar-ci.jks" easycalendar-ci \
            easycalendar-ci easycalendar-ci > client/android/key.properties
      - run: flutter pub get
        working-directory: client
      - name: Build Android release APK
        run: flutter build apk --release --no-pub
        working-directory: client
      - name: Verify Android artifact
        run: test -f build/app/outputs/flutter-apk/app-release.apk
        working-directory: client

  macos-release:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - name: Configure macOS release build
        run: flutter build macos --release --config-only --no-pub
        working-directory: client
      - name: Build unsigned macOS release application
        run: >-
          xcodebuild
          -workspace macos/Runner.xcworkspace
          -scheme Runner
          -configuration Release
          -derivedDataPath build/macos
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=-
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
          REGISTER_APP_GROUPS=NO
          build
        working-directory: client
      - name: Verify macOS artifact
        run: >-
          test -x
          build/macos/Build/Products/Release/EasyCalendar.app/Contents/MacOS/EasyCalendar
        working-directory: client

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Visual Studio ATL component
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installationPaths = @(& $vswhere -all -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($installationPaths.Count -eq 0) { throw 'Visual Studio installation was not found' }
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          foreach ($installationPath in $installationPaths) {
            $atlHeader = Get-ChildItem (Join-Path $installationPath 'VC\Tools\MSVC') -Filter atlstr.h -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $atlHeader) {
              & $installer modify --installPath $installationPath --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart --wait
              if ($LASTEXITCODE -ne 0) { throw "Visual Studio ATL installation failed with exit code $LASTEXITCODE for $installationPath" }
            }
            if ($null -eq (Get-ChildItem (Join-Path $installationPath 'VC\Tools\MSVC') -Filter atlstr.h -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)) { throw "atlstr.h is unavailable in $installationPath after installing the ATL component" }
          }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - name: Build Windows release application
        run: flutter build windows --release --no-pub
        working-directory: client
      - name: Verify Windows artifact
        shell: pwsh
        run: >-
          if (-not (Test-Path
          "client\build\windows\x64\runner\Release\EasyCalendar.exe"))
          { throw "EasyCalendar.exe was not built" }

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run check
        working-directory: server

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  quality-gate:
    if: ${{ always() && !cancelled() }}
    needs:
      - client
      - android-release
      - macos-release
      - windows-release
      - worker
      - core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test and native build
        env:
          CLIENT_RESULT: ${{ needs.client.result }}
          ANDROID_RESULT: ${{ needs.android-release.result }}
          MACOS_RESULT: ${{ needs.macos-release.result }}
          WINDOWS_RESULT: ${{ needs.windows-release.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          for result in \
            "$CLIENT_RESULT" "$ANDROID_RESULT" "$MACOS_RESULT" \
            "$WINDOWS_RESULT" "$WORKER_RESULT" "$CORE_RESULT"; do
            test "$result" = success
          done

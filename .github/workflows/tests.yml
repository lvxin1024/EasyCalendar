name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: flutter analyze
        working-directory: client
      - run: flutter test
        working-directory: client

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --locked
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_HOME is not set}}"
          ndk_dir="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$ndk_dir"
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
      - name: Build native P2P bridge
        run: bash scripts/build_native_p2p.sh android client/android/app/src/main/jniLibs
      - name: Configure ephemeral CI signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/easycalendar-ci.jks" \
            -storepass easycalendar-ci -keypass easycalendar-ci \
            -alias easycalendar-ci -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=EasyCalendar CI"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/easycalendar-ci.jks" easycalendar-ci \
            easycalendar-ci easycalendar-ci > client/android/key.properties
      - run: flutter pub get
        working-directory: client
      - name: Build Android release APK
        run: flutter build apk --release --no-pub
        working-directory: client
      - name: Verify Android artifact
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$apk" | grep -q "lib/$abi/libeasycalendar_p2p.so"
          done
        working-directory: client

  macos-release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build native P2P bridge
        shell: bash
        run: bash scripts/build_native_p2p.sh macos "$RUNNER_TEMP/easycalendar-p2p"
      - run: flutter pub get
        working-directory: client
      - name: Configure macOS release build
        run: flutter build macos --release --config-only --no-pub
        working-directory: client
      - name: Remove Widget target from unsigned CI build
        run: python3 ../scripts/strip_macos_widget_for_unsigned_ci.py
        working-directory: client
      - name: Build unsigned macOS release application
        run: >-
          xcodebuild
          -workspace macos/Runner.xcworkspace
          -scheme Runner
          -configuration Release
          -derivedDataPath build/macos
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=-
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
          REGISTER_APP_GROUPS=NO
          build
        working-directory: client
      - name: Add native P2P bridge to app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="client/build/macos/Build/Products/Release/EasyCalendar.app"
          mkdir -p "$app/Contents/Frameworks"
          cp "$RUNNER_TEMP/easycalendar-p2p/libeasycalendar_p2p.dylib" \
            "$app/Contents/Frameworks/libeasycalendar_p2p.dylib"
          test -f "$app/Contents/Frameworks/libeasycalendar_p2p.dylib"
      - name: Verify macOS artifact
        run: >-
          test -x
          build/macos/Build/Products/Release/EasyCalendar.app/Contents/MacOS/EasyCalendar
        working-directory: client

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Visual Studio ATL component
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installationPaths = @(& $vswhere -all -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($installationPaths.Count -eq 0) { throw 'Visual Studio installation was not found' }
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          foreach ($installationPath in $installationPaths) {
            $atlHeader = Get-ChildItem (Join-Path $installationPath 'VC\Tools\MSVC') -Filter atlstr.h -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $atlHeader) {
              & $installer modify --installPath $installationPath --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart --wait
              if ($LASTEXITCODE -ne 0) { throw "Visual Studio ATL installation failed with exit code $LASTEXITCODE for $installationPath" }
            }
            if ($null -eq (Get-ChildItem (Join-Path $installationPath 'VC\Tools\MSVC') -Filter atlstr.h -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)) { throw "atlstr.h is unavailable in $installationPath after installing the ATL component" }
          }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native P2P bridge
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "client\build\native\windows" | Out-Null
          & .\scripts\build_native_p2p.ps1 -OutputDirectory "client\build\native\windows"
      - run: flutter pub get
        working-directory: client
      - name: Build Windows release application
        run: flutter build windows --release --no-pub
        working-directory: client
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          if (-not (Test-Path
          "client\build\windows\x64\runner\Release\EasyCalendar.exe"))
          { throw "EasyCalendar.exe was not built" }
          if (-not (Test-Path
          "client\build\windows\x64\runner\Release\easycalendar_p2p.dll"))
          { throw "easycalendar_p2p.dll was not packaged" }

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run check
        working-directory: server

  native-p2p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check
        working-directory: native/easycalendar_p2p
      - run: cargo test
        working-directory: native/easycalendar_p2p

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  quality-gate:
    if: ${{ always() && !cancelled() }}
    needs:
      - client
      - android-release
      - macos-release
      - windows-release
      - worker
      - native-p2p
      - core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test and native build
        env:
          CLIENT_RESULT: ${{ needs.client.result }}
          ANDROID_RESULT: ${{ needs.android-release.result }}
          MACOS_RESULT: ${{ needs.macos-release.result }}
          WINDOWS_RESULT: ${{ needs.windows-release.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
          NATIVE_P2P_RESULT: ${{ needs.native-p2p.result }}
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          for result in \
            "$CLIENT_RESULT" "$ANDROID_RESULT" "$MACOS_RESULT" \
            "$WINDOWS_RESULT" "$WORKER_RESULT" "$NATIVE_P2P_RESULT" "$CORE_RESULT"; do
            test "$result" = success
          done

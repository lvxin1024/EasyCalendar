name: Client Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(awk '/^version: / { print $2 }' client/pubspec.yaml)"
          build_name="${pubspec_version%%+*}"
          build_number="${pubspec_version#*+}"
          test "$tag_version" = "$build_name"
          [[ "$build_number" =~ ^[0-9]+$ ]]
          echo "name=$build_name" >> "$GITHUB_OUTPUT"
          echo "number=$build_number" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Configure release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          configured=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if test -n "${!name}"; then configured=$((configured + 1)); fi
          done
          if test "$configured" -eq 0; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/easycalendar-ci.jks" \
              -storepass easycalendar-ci -keypass easycalendar-ci \
              -alias easycalendar-ci -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=EasyCalendar CI"
            keystore_path="$RUNNER_TEMP/easycalendar-ci.jks"
            store_password=easycalendar-ci
            key_alias=easycalendar-ci
            key_password=easycalendar-ci
            echo "Android signing secrets are absent; unsigned release assets will be built."
          elif test "$configured" -eq 4; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            keystore_path="$RUNNER_TEMP/easycalendar-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            store_password="$ANDROID_STORE_PASSWORD"
            key_alias="$ANDROID_KEY_ALIAS"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            echo "Configure all Android signing secrets or remove all of them." >&2
            exit 1
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore_path" "$store_password" "$key_alias" "$key_password" \
            > client/android/key.properties
      - run: flutter pub get
        working-directory: client
      - name: Build APK
        working-directory: client
        run: |
          flutter build apk --release \
            --build-name "${{ needs.version.outputs.name }}" \
            --build-number "${{ needs.version.outputs.number }}"
          mkdir -p build/release
          suffix=""
          if test "${{ steps.signing.outputs.enabled }}" = "false"; then suffix="-unsigned"; fi
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/release/EasyCalendar-${{ needs.version.outputs.name }}${suffix}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: client/build/release/*.apk
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Visual Studio ATL component
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installationPaths = @(& $vswhere -all -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($installationPaths.Count -eq 0) { throw 'Visual Studio installation was not found' }
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
          foreach ($installationPath in $installationPaths) {
            $atlHeader = Get-ChildItem (Join-Path $installationPath 'VC\Tools\MSVC') -Filter atlstr.h -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $atlHeader) {
              & $installer modify --installPath $installationPath --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart --wait
              if ($LASTEXITCODE -ne 0) { throw "Visual Studio ATL installation failed with exit code $LASTEXITCODE for $installationPath" }
            }
            if ($null -eq (Get-ChildItem (Join-Path $installationPath 'VC\Tools\MSVC') -Filter atlstr.h -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)) { throw "atlstr.h is unavailable in $installationPath after installing the ATL component" }
          }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Detect Windows signing configuration
        id: signing
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -and $hasPassword) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif (-not $hasCertificate -and -not $hasPassword) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Windows signing secrets are absent; unsigned release assets will be built."
          } else {
            throw "Configure both Windows signing secrets or remove both of them."
          }
      - run: flutter pub get
        working-directory: client
      - name: Build Windows application
        working-directory: client
        run: >-
          flutter build windows --release
          --build-name "${{ needs.version.outputs.name }}"
          --build-number "${{ needs.version.outputs.number }}"
      - name: Import code signing certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "easycalendar-release.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $certificate) { throw "The PFX does not contain a code-signing private key" }
          "WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Sign application executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signTool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signTool sign /sha1 $env:WINDOWS_CERT_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 client\build\windows\x64\runner\Release\EasyCalendar.exe
          if ($LASTEXITCODE -ne 0) { throw "Application signing failed" }
      - name: Build and package Windows release
        shell: pwsh
        run: |
          $signingEnabled = "${{ steps.signing.outputs.enabled }}" -eq "true"
          $buildDir = (Resolve-Path "client\build\windows\x64\runner\Release").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $outputDir = Join-Path $PWD "client\windows\build\release"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $iscc "/O$outputDir" "/DAppVersion=${{ needs.version.outputs.name }}" "/DBuildDir=$buildDir" client\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          $installer = "client\windows\build\release\EasyCalendar-${{ needs.version.outputs.name }}-windows-x64-setup.exe"
          if ($signingEnabled) {
            $signTool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            & $signTool sign /sha1 $env:WINDOWS_CERT_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer
            if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }
            & $signTool verify /pa $installer
            if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed" }
          } else {
            $unsignedInstaller = "client\windows\build\release\EasyCalendar-${{ needs.version.outputs.name }}-unsigned-windows-x64-setup.exe"
            Move-Item -Path $installer -Destination $unsignedInstaller
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: client/windows/build/release/*.exe
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-26
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_APP_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROVISION_PROFILE_BASE64 }}
      MACOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_PROVISION_PROFILE_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Detect macOS signing configuration
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          required=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGNING_IDENTITY
            MACOS_APP_PROVISION_PROFILE_BASE64
            MACOS_WIDGET_PROVISION_PROFILE_BASE64
            APPLE_ID
            APPLE_APP_PASSWORD
            APPLE_TEAM_ID
          )
          configured=0
          for name in "${required[@]}"; do
            if test -n "${!name}"; then
              configured=$((configured + 1))
            fi
          done
          if test "$configured" -eq 0; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are absent; an ad-hoc signed DMG will be built without the Widget."
          elif test "$configured" -eq "${#required[@]}"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure all macOS signing secrets or remove all of them."
            exit 1
          fi
      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/easycalendar-release.p12"
          keychain_path="$RUNNER_TEMP/easycalendar.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$keychain_path"
      - run: flutter pub get
        working-directory: client
      - name: Configure and build unsigned macOS application
        working-directory: client
        run: |
          flutter build macos --release --config-only \
            --build-name "${{ needs.version.outputs.name }}" \
            --build-number "${{ needs.version.outputs.number }}" \
            --dart-define=EASYCALENDAR_USE_DATA_PROTECTION_KEYCHAIN=${{ steps.signing.outputs.enabled }}
          register_app_groups=YES
          if test "${{ steps.signing.outputs.enabled }}" = "false"; then
            register_app_groups=NO
            python3 ../scripts/strip_macos_widget_for_unsigned_ci.py
          fi
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            REGISTER_APP_GROUPS="$register_app_groups" \
            build
      - name: Sign, package, and notarize DMG
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="client/build/macos/Build/Products/Release/EasyCalendar.app"
          widget="$app/Contents/PlugIns/EasyCalendarWidget.appex"
          printf '%s' "$MACOS_APP_PROVISION_PROFILE_BASE64" | base64 -D > "$app/Contents/embedded.provisionprofile"
          printf '%s' "$MACOS_WIDGET_PROVISION_PROFILE_BASE64" | base64 -D > "$widget/Contents/embedded.provisionprofile"
          find "$app/Contents/Frameworks" -type f \( -name '*.dylib' -o -perm -111 \) -print0 | while IFS= read -r -d '' binary; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$binary"
          done
          find "$app/Contents/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' framework; do
            codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$framework"
          done
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
            --entitlements client/macos/EasyCalendarWidget/EasyCalendarWidget.entitlements "$widget"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
            --entitlements client/macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p client/build/release/dmg
          cp -R "$app" client/build/release/dmg/EasyCalendar.app
          ln -s /Applications client/build/release/dmg/Applications
          dmg="client/build/release/EasyCalendar-${{ needs.version.outputs.name }}-macos.dmg"
          hdiutil create -volname EasyCalendar -srcfolder client/build/release/dmg -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: Ad-hoc sign and package unsigned DMG
        if: steps.signing.outputs.enabled == 'false'
        shell: bash
        run: |
          set -euo pipefail
          app="client/build/macos/Build/Products/Release/EasyCalendar.app"
          widget="$app/Contents/PlugIns/EasyCalendarWidget.appex"
          rm -rf "$widget"
          rmdir "$app/Contents/PlugIns" 2>/dev/null || true

          entitlements="$RUNNER_TEMP/easycalendar-adhoc.entitlements"
          cp client/macos/Runner/Release.entitlements "$entitlements"
          /usr/libexec/PlistBuddy -c "Delete :com.apple.security.application-groups" "$entitlements"
          /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" "$entitlements"

          # Ad-hoc signatures have no stable Team ID. Enabling hardened runtime
          # would make macOS reject the separately signed Flutter frameworks.
          find "$app/Contents/Frameworks" -type f \( -name '*.dylib' -o -perm -111 \) -print0 | while IFS= read -r -d '' binary; do
            codesign --force --sign - "$binary"
          done
          find "$app/Contents/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' framework; do
            codesign --force --sign - "$framework"
          done
          codesign --force --sign - \
            --entitlements "$entitlements" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          rm -rf client/build/release/dmg
          mkdir -p client/build/release/dmg
          cp -R "$app" client/build/release/dmg/EasyCalendar.app
          ln -s /Applications client/build/release/dmg/Applications
          dmg="client/build/release/EasyCalendar-${{ needs.version.outputs.name }}-unsigned-macos.dmg"
          hdiutil create -volname EasyCalendar -srcfolder client/build/release/dmg -ov -format UDZO "$dmg"
          rm -rf client/build/release/dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: client/build/release/*.dmg
          if-no-files-found: error

  ios:
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Generate iOS runner
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          generated_root="$(mktemp -d)"
          trap 'rm -rf "$generated_root"' EXIT
          flutter create \
            --project-name easy_calendar \
            --org io.easycalendar \
            --platforms ios \
            "$generated_root/easy_calendar"
          cp -R "$generated_root/easy_calendar/ios" ios
      - run: flutter pub get
        working-directory: client
      - name: Build unsigned iOS IPA
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-name "${{ needs.version.outputs.name }}" \
            --build-number "${{ needs.version.outputs.number }}"
          app="build/ios/iphoneos/Runner.app"
          test -d "$app"
          payload="$(mktemp -d)"
          trap 'rm -rf "$payload"' EXIT
          mkdir -p "$payload/Payload"
          cp -R "$app" "$payload/Payload/EasyCalendar.app"
          mkdir -p build/release
          (cd "$payload" && zip -qry "$GITHUB_WORKSPACE/client/build/release/EasyCalendar-${{ needs.version.outputs.name }}-unsigned-ios.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: client/build/release/*.ipa
          if-no-files-found: error

  publish:
    needs: [version, android, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate installation notice
        shell: bash
        run: |
          set -euo pipefail
          notice="$RUNNER_TEMP/release-installation-notice.md"
          {
            echo "## Installation notes"
            echo
            if compgen -G 'release-assets/*-unsigned-macos.dmg' > /dev/null; then
              echo '> [!WARNING]'
              echo '> The macOS DMG is ad-hoc signed and not notarized. After copying EasyCalendar to Applications, open it from Finder with **Right-click > Open**. The macOS Widget is not included in this build.'
              echo
            fi
            if compgen -G 'release-assets/*-unsigned-android.apk' > /dev/null; then
              echo '> [!WARNING]'
              echo '> The Android APK was built with a temporary CI key because Android signing secrets were not configured. Configure the Android secrets before distributing production updates.'
              echo
            fi
            if compgen -G 'release-assets/*-unsigned-windows-x64-setup.exe' > /dev/null; then
              echo '> [!WARNING]'
              echo '> The Windows installer is unsigned. Windows SmartScreen may require **More info > Run anyway**.'
              echo
            fi
            if compgen -G 'release-assets/*-unsigned-ios.ipa' > /dev/null; then
              echo '> [!WARNING]'
              echo '> The iOS IPA is unsigned and is intended for build verification or manual signing before device installation.'
              echo
            fi
          } > "$notice"
          echo "RELEASE_BODY_PATH=$notice" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.RELEASE_BODY_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.ipa

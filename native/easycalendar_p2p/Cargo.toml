[package]
name = "easycalendar_p2p"
version = "0.1.0"
edition = "2021"
description = "Transport-neutral native bridge for EasyCalendar group sync"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
hmac = "0.12"
iroh = "1.1.0"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

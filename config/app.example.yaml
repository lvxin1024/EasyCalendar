# EasyCalendar runtime configuration.
# Copy this file to config/app.yaml. The Python prototype reads app.yaml at startup.

app:
  name: EasyCalendar
  instance_name: my-easycalendar
  timezone: Asia/Shanghai
  locale: zh-CN
  data_dir: ./data
  default_collection_id: collection_local
  default_collection_name: 我的日程
  default_collection_color: "#2563EB"

server:
  mode: local
  host: 0.0.0.0
  port: 8000
  debug: false
  public_url: http://localhost:8000
  cors_allowed_origins:
    - http://localhost:8000

storage:
  driver: sqlite
  sqlite_path: ./data/app.sqlite3
  backup_dir: ./data/backups

sync:
  enabled: false
  pull_limit: 200
  retry_limit: 8

subscriptions:
  enabled: true
  refresh_cron: "0 */6 * * *"
  request_timeout_seconds: 20

assistant:
  enabled: false
  provider: rules
  base_url: null
  model: null
  timeout_seconds: 45
  max_input_chars: 20000

notifications:
  enabled: false
  adapter: memory
  restore_on_start: true

integrations:
  ical_output_dir: ./config/calendars
  google_credentials_file: ./config/google_credentials.json
  google_token_file: ./config/google_token.json
  outlook_tenant_id: common

widget:
  enabled: false
  snapshot_path: ./data/widget/snapshot.json

deployment:
  provider: docker
  auto_migrate: true
  auto_backup_before_migrate: true
